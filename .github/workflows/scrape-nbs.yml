name: NBS Scraper

on:
  workflow_dispatch:
  push:
    branches:
      - jovanstevanovic-mcp-server

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run scraper
        run: python3 -m app.scripts.run_scraper
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: nbs-scrape-output
          path: nbs_scrape_output.json
